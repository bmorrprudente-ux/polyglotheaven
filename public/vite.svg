<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sunGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </radialGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0284C7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Radiant Golden Sun Rays -->
  <g stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" opacity="0.95">
    <line x1="42" y1="4" x2="42" y2="11"/>
    <line x1="56" y1="10" x2="51" y2="15"/>
    <line x1="61" y1="24" x2="54" y2="24"/>
    <line x1="57" y1="38" x2="51" y2="34"/>
    <line x1="28" y1="10" x2="33" y2="15"/>
  </g>

  <!-- Glowing Sun Disc -->
  <circle cx="42" cy="24" r="16" fill="url(#sunGlow)"/>

  <!-- Heavenly Cloud in front -->
  <g filter="url(#glow)">
    <path d="M19 54 C10.7 54 4 47.3 4 39 C4 31.7 9.3 25.6 16.3 24.3 C18.3 15.6 26.1 9 35.3 9 C46.1 9 55 17.9 55 28.7 C55 29.6 54.9 30.6 54.8 31.5 C58.3 33.4 60.5 37.1 60.5 41.3 C60.5 47.3 55.6 52.2 49.6 52.2 L19 52.2 Z"
          fill="url(#cloudGrad)"
          stroke="#38BDF8"
          stroke-width="2"/>
    <ellipse cx="32" cy="18" rx="8" ry="4" fill="#FFFFFF" opacity="0.8"/>
  </g>
</svg>
